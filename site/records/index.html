</head><body><a class="skip" href="#main-content">Skip to main content</a><div class="wrap">
<header class="mu">
  <a class="brand" href="/"><img src="/assets/crest-88.png" alt="" width="44" height="44" decoding="async"><h1><small>Republic of Ireland</small>Ireland Football</h1></a>
  <div class="from" id="from">History<span>Records</span></div>
</header>
<nav class="munav" aria-label="Sections"></nav>
<main id="main-content" tabindex="-1">

<div class="sheet" id="sum"><p class="sub">Loading…</p></div>
<div class="two" style="margin-top:12px"><div class="sheet" style="margin-top:0" id="caps"></div><div class="sheet" style="margin-top:0" id="scorers"></div></div>
<div class="two" style="margin-top:12px"><div class="sheet" style="margin-top:0" id="wins"></div><div class="sheet" style="margin-top:0" id="defeats"></div></div>
<div class="two" style="margin-top:12px"><div class="sheet" style="margin-top:0" id="runs"></div><div class="sheet" style="margin-top:0" id="comps"></div></div>
<div class="two" style="margin-top:12px"><div class="sheet" style="margin-top:0" id="decades"></div><div class="sheet" style="margin-top:0" id="grounds"></div></div>
<div class="sheet" id="hats"></div>

</main>
<footer class="mu"><span id="stamp"></span> Results and competitive scorers: <a href="https://github.com/martj42/international_results">martj42 international results</a> (CC0). Venues, managers, notes and caps: Wikipedia (CC BY-SA). Live data: API-Football. An independent fan site, not connected with the FAI.</footer>
</div>
<script src="/mu.js"></script>
<script>
(function(){
MU.nav('Records'); MU.checked("archive",document.getElementById("stamp"),"Archive built");
var $=function(i){return document.getElementById(i)}, E=MU.esc;
function dt(d,o){return new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",o||{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})}
function rc(m){return m.gf>m.ga?"rw":m.gf<m.ga?"rl":"rd"}
function score(m){return '<span class="'+rc(m)+'">'+m.gf+'–'+m.ga+'</span>'+(m.pw!=null?' <small>'+(m.pw?"won":"lost")+' on pens</small>':'')}
function ven(h){return h===1?"H":h===-1?"A":"N"}
function scs(m){var a=(m.sc||[]).map(function(s){return E(s[0])+(s[1]?" "+E(s[1])+"′":"")+(s[2]==="p"?" (pen)":s[2]==="og"?" (og)":"")}); return a.join(", ")}
function wl(t){return t.w+"W "+t.d+"D "+t.l+"L"}
function pct(t){return t.p?Math.round(100*t.w/t.p):0}

function tb(h,rows){return '<table class="mu"><thead><tr>'+h.map(function(x){return '<th'+(x[1]?' class="n"':'')+'>'+x[0]+'</th>'}).join("")+'</tr></thead><tbody>'+rows.join("")+'</tbody></table>'}
function mrow(m){return '<tr><td style="white-space:nowrap">'+score(m)+'</td><td>'+MU.club(m.o,14)+'</td><td>'+dt(m.d)+'</td></tr>'}
function tl(name,t){return '<tr><td>'+name+'</td><td class="n">'+t.p+'</td><td class="n">'+t.w+'</td><td class="n">'+t.d+'</td><td class="n">'+t.l+'</td><td class="n">'+t.gf+'</td><td class="n">'+t.ga+'</td><td class="n">'+pct(t)+'</td></tr>'}
var TH=[["",0],["P",1],["W",1],["D",1],["L",1],["GF",1],["GA",1],["Win %",1]];
fetch("/history/records.json").then(function(r){return r.json()}).then(function(R){var a=R.all;
 $("sum").innerHTML='<h2>All-time record</h2><div class="h2h"><div><b>'+a.p+'</b><span>Played</span></div><div class="w"><b>'+a.w+'</b><span>Won</span></div><div><b>'+a.d+'</b><span>Drawn</span></div><div class="l"><b>'+a.l+'</b><span>Lost</span></div><div><b>'+a.gf+'</b><span>For</span></div><div><b>'+a.ga+'</b><span>Against</span></div></div>'+tb(TH,[tl("Home",R.home),tl("Away",R.away),tl("Neutral",R.neutral)])+'<p class="sub">Other counts differ slightly depending on which early and unofficial games are included: eu-football.info has 639 games with 247 wins, 180 draws and 212 defeats.</p>';
 $("caps").innerHTML='<h2>Most caps</h2>'+tb([["Player",0],["Caps",1],["Goals",1],["Career",0]],R.caps.map(function(p){return '<tr><td><a href="/player/?p='+p.slug+'">'+E(p.name)+'</a></td><td class="n">'+p.caps+'</td><td class="n">'+p.goals+'</td><td>'+(p.debut||"").slice(0,4)+'–'+(p.last||"").slice(0,4)+'</td></tr>'}));
 $("scorers").innerHTML='<h2>Most goals</h2>'+tb([["Player",0],["Goals",1],["Caps",1],["Career",0]],R.scorers.map(function(p){return '<tr><td><a href="/player/?p='+p.slug+'">'+E(p.name)+'</a></td><td class="n">'+p.goals+'</td><td class="n">'+p.caps+'</td><td>'+(p.debut||"").slice(0,4)+'–'+(p.last||"").slice(0,4)+'</td></tr>'}));
 $("wins").innerHTML='<h2>Biggest wins</h2>'+tb([["Score",0],["Opponent",0],["Date",0]],R.wins.map(mrow));
 $("defeats").innerHTML='<h2>Heaviest defeats</h2>'+tb([["Score",0],["Opponent",0],["Date",0]],R.defeats.map(mrow));
 $("runs").innerHTML='<h2>Longest runs</h2>'+tb([["Run",0],["Games",1],["From",0],["To",0]],Object.keys(R.runs).map(function(k){var x=R.runs[k]; return '<tr><td>'+k+'</td><td class="n">'+x.n+'</td><td>'+dt(x.from)+'</td><td>'+dt(x.to)+'</td></tr>'}));
 $("comps").innerHTML='<h2>By competition</h2>'+tb(TH,R.comps.map(function(c){return tl(MU.compRow({c:c.c,t:c.name,d:"2026"})+'<a href="/results/?comp='+c.c+'">'+c.name+'</a>',c)}));
 $("decades").innerHTML='<h2>By decade</h2>'+tb(TH,R.decades.map(function(c){return tl('<a href="/results/?dec='+c.dec.slice(0,4)+'">'+c.dec+'</a>',c)}));
 $("grounds").innerHTML='<h2>Home grounds</h2>'+tb([["Ground",0],["Games",1]],R.grounds.map(function(g){return '<tr><td>'+E(g[0])+'</td><td class="n">'+g[1]+'</td></tr>'}));
 $("hats").innerHTML='<h2>Hat-tricks on record</h2><p class="sub" style="margin:0 0 8px">Friendlies before 2017 are missing, as their scorers are not in the data yet.</p>'+tb([["Player",0],["Goals",1],["Opponent",0],["Date",0]],R.hats.slice().reverse().map(function(h){return '<tr><td>'+E(h.name)+'</td><td class="n">'+h.g+'</td><td>'+MU.club(h.o,14)+'</td><td>'+dt(h.d)+'</td></tr>'}));
});

})();
</script></body></html>
