<style>
.mc .k{font-size:13px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px} .mc .k .cm{display:inline-flex;align-items:center;gap:6px;min-width:0}
.mc .pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;white-space:nowrap;color:var(--on-flag);background:var(--draw)} .mc .pill.rW{background:var(--win)} .mc .pill.rL{background:var(--loss)}
.mc .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:16px 0 10px}
.mc .team{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px;font-weight:600;text-align:center} .mc .team img{width:56px!important;height:56px!important;object-fit:contain;margin:0!important} .mc .team a{color:var(--ink)}
.mc .score{font-size:56px;line-height:1;text-align:center} .mc .score small{display:block;font-family:var(--body);font-size:12px;letter-spacing:0;color:var(--muted);margin-top:6px}
.mc .line{font-size:14px;color:var(--muted);text-align:center;margin:0 0 12px;max-width:none}
.mc .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
h2.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px} h2 small.sub{font-size:14px;font-weight:400}
.rep{display:grid;grid-template-columns:1fr;gap:0} .rep .sheet{margin-top:12px}
@media (min-width:900px){.rep{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px;align-items:start} .rep .col{display:flex;flex-direction:column;min-width:0}}
.report h3{font-size:15px;margin:16px 0 4px}
ul.rf{list-style:none;margin:0;padding:0;font-size:14px} ul.rf li{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--rule)} ul.rf li:first-child{border-top:0} ul.rf b{font-weight:600;color:var(--muted);font-size:13px} ul.rf small{color:var(--muted)}
.h2h+ul.rf{margin-top:10px}
ol.xi{margin:0;padding:0 0 0 22px;columns:2;font-size:14px;line-height:1.9}
.pager{display:flex;justify-content:space-between;gap:12px;margin:16px 0 0;font-size:14px} .pager a{color:var(--red-ink);font-weight:600;text-decoration:none}
#src{font-size:12px;color:var(--muted);margin:14px 0 0;max-width:none}
@media (max-width:560px){ul.rf li{grid-template-columns:1fr;gap:2px} .mc .score{font-size:48px}}

</head><body><a class="skip" href="#main-content">Skip to main content</a><div class="wrap">
<header class="mu">
  <a class="brand" href="/"><img src="/assets/crest-88.png" alt="" width="44" height="44" decoding="async"><h1><small>Republic of Ireland</small>Ireland Football</h1></a>

</header>

<main id="main-content" tabindex="-1">
<div class="sheet mc" id="card"><p class="sub">Loading…</p></div>
<div class="rep">
 <div class="col"><div class="sheet" id="goals"></div><div class="sheet" id="lineup" hidden></div></div>
 <div class="col"><div class="sheet" id="notes" hidden></div><div class="sheet" id="h2h"></div></div>
</div>

</main>
<footer class="mu"><span id="stamp"></span> Results and competitive scorers: <a href="https://github.com/martj42/international_results">martj42 international results</a> (CC0). Venues, managers, notes and caps: Wikipedia (CC BY-SA). Live data: API-Football. An independent fan site, not connected with the FAI.</footer>
</div>
<script src="/mu.js"></script>
<script>
(function(){
MU.nav('Results'); MU.checked("archive",document.getElementById("stamp"),"Archive built");
var $=function(i){return document.getElementById(i)}, E=MU.esc, q=new URLSearchParams(location.search), D=q.get("d")||"";
function J(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function dt(d,o){return new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",o||{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})}
function res(m){return m.pw!=null?(m.pw?"W":"L"):m.gf>m.ga?"W":m.gf<m.ga?"L":"D"}
function ord(n){var s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0])}
var IE='<img class="crest" src="/assets/crest-88.png" alt="" width="56" height="56">';
function pl(name,slug){return slug?'<a href="/player/?p='+slug+'">'+E(name)+'</a>':E(name)}
var DEC={"1980":"1980–1989","1990":"1990–1999","2000":"2000–2009","2010":"2010–2019","2020":"2020–present"};
Promise.all([J("/history/matches.json"),J("/history/reports.json"),J("/history/players.json"),J("/history/player_goals.json"),J("/history/lineups.json").catch(function(){return {}})]).then(function(a){
  var L=a[0], R=a[1], P=a[2], PG=a[3], LU=a[4], k=-1;
  for(var i=0;i<L.length;i++)if(L[i].d===D){k=i;break}
  if(k<0){$("card").innerHTML='<h2>Match report</h2><p class="sub">No Ireland game on that date. <a href="/results/">Every result</a>.</p>'; return}
  var m=L[k], r=R[m.d]||{}, usLeft=m.h!==-1, opp=MU.crest(m.o,56)||'';
  var hs=usLeft?m.gf:m.ga, as=usLeft?m.ga:m.gf, rr=res(m);
  document.title=(usLeft?"Ireland "+hs+"–"+as+" "+m.o:m.o+" "+hs+"–"+as+" Ireland")+", "+dt(m.d)+" · Ireland Football";
  var extra=[]; if(r.aet||m.pw!=null)extra.push("After extra time"); if(m.pw!=null&&r.pens){var pu=r.pens.us.filter(function(x){return x[1]}).length, pt=r.pens.them.filter(function(x){return x[1]}).length; extra.push((m.pw?"Won ":"Lost ")+pu+"–"+pt+" on penalties")} else if(m.pw!=null)extra.push(m.pw?"Won on penalties":"Lost on penalties");
  var where=[r.ground, r.loc||m.city].filter(Boolean); if(!r.ground&&m.v)where=[m.v];
  var facts=[]; if(r.att)facts.push("Crowd "+r.att); if(r.ref)facts.push("Referee "+E(r.ref));
  var acts=[]; if(m.id)acts.push('<a class="btn" href="/match/?id='+m.id+'">Match centre</a>'); if(m.bm)acts.push('<a class="btn'+(m.id?' ghost':'')+'" href="/matches/'+m.bm+'/">'+E(m.bml)+'</a>'); if(m.camp)acts.push('<a class="btn ghost" href="/campaigns/'+m.camp+'/">'+E(m.campn)+' campaign</a>');
  $("card").innerHTML='<div class="k"><span class="cm">'+MU.compRow(m,16)+E(m.t)+'</span><span class="pill r'+rr+'">'+({W:"Won",D:"Drawn",L:"Lost"})[rr]+'</span></div>'+
    '<div class="vs"><div class="team">'+(usLeft?IE+'Ireland':opp+MU.club(m.o).replace(/<img[^>]*>/,""))+'</div><div class="score">'+hs+'–'+as+(extra.length?'<small>'+extra.join(" · ")+'</small>':'')+'</div><div class="team">'+(usLeft?opp+MU.club(m.o).replace(/<img[^>]*>/,""):IE+'Ireland')+'</div></div>'+
    '<p class="line">'+dt(m.d,{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"})+'<br>'+E(where.join(", "))+(m.h===0?" (neutral)":"")+(facts.length?'<br>'+facts.join(" · "):'')+'</p>'+
    (acts.length?'<div class="acts">'+acts.join("")+'</div>':'');

  // goals: Wikipedia's box when it agrees with the archive, otherwise the archive's own scorers
  var g=r.g, h='';
  if(g&&g.length){var u=0,t=0; h='<ul class="tl">'+g.map(function(x){if(x[0])u++; else t++; var s=usLeft?u+"–"+t:t+"–"+u;
      return '<li class="'+(x[0]?"us":"them")+'"><span class="t">'+E(x[2])+'′</span><span>'+(x[3]==="p"?"(pen) ":x[3]==="og"?"(og) ":"")+(x[0]?pl(x[1],x[4]):E(x[1]))+'</span><span class="sc">'+s+'</span></li>'}).join("")+'</ul>'}
  else if(m.sc&&m.sc.length){h='<ul class="tl">'+m.sc.map(function(s){var p=P.filter(function(x){return x.name===s[0]})[0]; return '<li class="us"><span class="t">'+(s[1]?E(s[1])+'′':'')+'</span><span>'+(s[2]==="p"?"(pen) ":s[2]==="og"?"(og) ":"")+pl(s[0],p&&p.slug)+'</span><span class="sc"></span></li>'}).join("")+'</ul>'+(m.ga?'<p class="sub">The other side’s scorers are not on record here.</p>':'')}
  else if(m.gf+m.ga===0)h='<p class="sub">No goals.</p>'; else h='<p class="sub">The scorers are not on record here.</p>';
  if(r.pens){var first=r.pens.first==="us"?r.pens.us:r.pens.them, second=r.pens.first==="us"?r.pens.them:r.pens.us, fu=r.pens.first==="us", rows=[], cu=0, ct=0;
    for(var j=0;j<Math.max(first.length,second.length);j++)[[first[j],fu],[second[j],!fu]].forEach(function(z){if(!z[0])return; if(z[1]){if(z[0][1])cu++} else if(z[0][1])ct++; rows.push('<li class="'+(z[1]?"us":"them")+'"><span class="t">'+(z[0][1]?"✓":"✗")+'</span><span>'+E(z[0][0])+(z[0][1]?"":" <small>missed</small>")+'</span><span class="sc">'+(usLeft?cu+"–"+ct:ct+"–"+cu)+'</span></li>')});
    h+='<h3>Shoot-out</h3><ul class="tl">'+rows.join("")+'</ul>'}
  $("goals").innerHTML='<h2>Goals</h2><div class="report">'+h+'</div>';

  // the day for the players: debuts, final caps, goal counts
  var notes=[], deb=P.filter(function(p){return p.debut===m.d}), yearAgo=new Date(Date.now()-365*864e5).toISOString().slice(0,10), last=P.filter(function(p){return p.last===m.d&&p.debut!==m.d&&m.d<yearAgo});
  if(deb.length)notes.push('<li><b>Debut</b><span>'+deb.map(function(p){return pl(p.name,p.slug)}).join(", ")+'</span></li>');
  if(last.length)notes.push('<li><b>Final cap</b><span>'+last.map(function(p){return pl(p.name,p.slug)+' <small>('+p.caps+' caps)</small>'}).join(", ")+'</span></li>');
  var scorers={}; Object.keys(PG).forEach(function(s){var n=PG[s].filter(function(x){return x.d<=m.d}).length; if(PG[s].some(function(x){return x.d===m.d}))scorers[s]=n});
  var sk=Object.keys(scorers); if(sk.length)notes.push('<li><b>Ireland goals so far</b><span>'+sk.map(function(s){var p=P.filter(function(x){return x.slug===s})[0]; return pl(p?p.name:s,s)+' <small>'+scorers[s]+'</small>'}).join(", ")+'</span></li>');
  if(m.ms)notes.push('<li><b>Manager</b><span><a href="/manager/?m='+m.ms+'">'+E(m.mn.replace(", Sr.",""))+'</a></span></li>');
  if(m.n)notes.push('<li><b>Note</b><span>'+E(m.n)+'</span></li>');
  $("notes").innerHTML=notes.length?'<h2>The players</h2><ul class="rf">'+notes.join("")+'</ul>':'';
  $("notes").hidden=!notes.length;

  // line-up when the feed has it (from 2012)
  var lu=LU[m.d]; if(lu&&lu.xi&&lu.xi.length){$("lineup").hidden=false;
    $("lineup").innerHTML='<h2>Line-up'+(lu.form?' <small class="sub">'+E(lu.form)+'</small>':'')+'</h2><ol class="xi">'+lu.xi.map(function(x){return '<li>'+pl(x.n,x.s)+'</li>'}).join("")+'</ol>'+
      ((lu.bench||[]).some(function(x){return x.on})?'<p class="sub" style="margin:8px 0 0">Came on: '+lu.bench.filter(function(x){return x.on}).map(function(x){return pl(x.n,x.s)}).join(", ")+'</p>':'')}

  // the record against this opponent up to and including this game
  var vs=L.filter(function(x){return x.o===m.o}), upto=vs.filter(function(x){return x.d<=m.d}), c={W:0,D:0,L:0}; upto.forEach(function(x){c[res(x)]++});
  var pi=vs.indexOf(m), pv=vs[pi-1], nv=vs[pi+1];
  $("h2h").innerHTML='<h2 class="row">Ireland v '+E(m.o)+' <a href="/opponent/?o='+MU.slug(m.o)+'">All meetings →</a></h2><p class="sub" style="margin:0 0 8px">'+(upto.length===1?"Their first meeting.":"Meeting number "+upto.length+".")+'</p><div class="h2h"><div><b>'+upto.length+'</b><span>Played</span></div><div class="w"><b>'+c.W+'</b><span>Won</span></div><div><b>'+c.D+'</b><span>Drawn</span></div><div class="l"><b>'+c.L+'</b><span>Lost</span></div></div>'+
    '<ul class="rf">'+(pv?'<li><b>Previous meeting</b><span>'+link(pv)+'</span></li>':'')+(nv?'<li><b>Next meeting</b><span>'+link(nv)+'</span></li>':'')+'</ul>';
  function link(x){return '<a href="'+(x.d>="1986"?'/report/?d='+x.d:'/results/?q='+encodeURIComponent(x.o))+'">'+dt(x.d)+'</a> '+x.gf+'–'+x.ga+' <small>'+E(x.t)+'</small>'}
  var pg=L[k-1], ng=L[k+1];
  $("pager").innerHTML=(pg?'<a href="'+(pg.d>="1986"?'/report/?d='+pg.d:'/results/')+'">← <span>'+dt(pg.d)+' v '+E(pg.o)+'</span></a>':'<span></span>')+(ng?'<a href="/report/?d='+ng.d+'"><span>'+dt(ng.d)+' v '+E(ng.o)+'</span> →</a>':'<span></span>');
  var src=[]; if(R[m.d])src.push('Goals, ground, crowd and referee: Wikipedia, <a href="https://en.wikipedia.org/wiki/Republic_of_Ireland_national_football_team_results_('+encodeURIComponent(DEC[m.d.slice(0,3)+"0"]||"")+')">results '+E(DEC[m.d.slice(0,3)+"0"]||"")+'</a> (CC BY-SA).');
  if(r.ext)src.push('<a href="'+E(r.ext)+'" rel="noopener">Report elsewhere</a>.');
  $("src").innerHTML=src.join(" ");
}).catch(function(e){$("card").innerHTML='<h2>Match report</h2><p class="sub">Couldn’t load the archive: '+E(e.message)+'</p>'});
})();
</script></body></html>
