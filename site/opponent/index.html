<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ireland · Opponent</title>
<link rel="icon" href="/assets/favicon-32.png" type="image/png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0b6e4f"><meta name="apple-mobile-web-app-title" content="Ireland">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/mu.css">
<style></style>
</head><body><a class="skip" href="#main-content">Skip to main content</a><div class="wrap">
<header class="mu">
  <a class="brand" href="/"><img src="/assets/crest-88.png" alt="" width="44" height="44" decoding="async"><h1><small>Republic of Ireland</small>Ireland Football</h1></a>
  <div class="from" id="from">Opponent<span></span></div>
</header>
<nav class="munav" aria-label="Sections"></nav>
<main id="main-content" tabindex="-1">

<div class="sheet" id="top"><p class="sub">Loading…</p></div><div class="sheet" id="games" hidden></div>

</main>
<footer class="mu"><span id="stamp"></span> Results and competitive scorers: <a href="https://github.com/martj42/international_results">martj42 international results</a> (CC0). Venues, managers, notes and caps: Wikipedia (CC BY-SA). Live data: API-Football. An independent fan site, not connected with the FAI.</footer>
</div>
<script src="/mu.js"></script>
<script>
(function(){
MU.nav('Opponents'); MU.checked("archive",document.getElementById("stamp"),"Archive built");
var $=function(i){return document.getElementById(i)}, E=MU.esc;
function dt(d,o){return new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",o||{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})}
function rc(m){return m.gf>m.ga?"rw":m.gf<m.ga?"rl":"rd"}
function score(m){return '<span class="'+rc(m)+'">'+m.gf+'–'+m.ga+'</span>'+(m.pw!=null?' <small>'+(m.pw?"won":"lost")+' on pens</small>':'')}
function ven(h){return h===1?"H":h===-1?"A":"N"}
function scs(m){var a=(m.sc||[]).map(function(s){return E(s[0])+(s[1]?" "+E(s[1])+"′":"")+(s[2]==="p"?" (pen)":s[2]==="og"?" (og)":"")}); return a.join(", ")}
function wl(t){return t.w+"W "+t.d+"D "+t.l+"L"}
function pct(t){return t.p?Math.round(100*t.w/t.p):0}

var o=new URLSearchParams(location.search).get("o");
Promise.all([fetch("/history/opponents.json").then(function(r){return r.json()}),fetch("/history/matches.json").then(function(r){return r.json()})]).then(function(a){var c=a[0].filter(function(x){return x.slug===o})[0];
  if(!c){$("top").innerHTML='<p class="sub">No games on record. <a href="/opponents/">See every opponent</a>.</p>';return}
  var L=a[1].filter(function(m){return m.o===c.name}); document.title="Ireland v "+c.name; $("from").innerHTML="Opponent<span>"+E(c.name)+"</span>";
  var best=L.slice().sort(function(x,y){return (y.gf-y.ga)-(x.gf-x.ga)})[0], worst=L.slice().sort(function(x,y){return (x.gf-x.ga)-(y.gf-y.ga)})[0], sc={}; L.forEach(function(m){(m.sc||[]).forEach(function(s){if(s[2]!=="og")sc[s[0]]=(sc[s[0]]||0)+1})}); var top=Object.keys(sc).sort(function(x,y){return sc[y]-sc[x]})[0];
  $("top").innerHTML='<h2>'+MU.crest(c.name,20)+'Ireland v '+E(c.name)+'</h2><div class="h2h"><div><b>'+c.p+'</b><span>Played</span></div><div class="w"><b>'+c.w+'</b><span>Won</span></div><div><b>'+c.d+'</b><span>Drawn</span></div><div class="l"><b>'+c.l+'</b><span>Lost</span></div><div><b>'+c.gf+'</b><span>For</span></div><div><b>'+c.ga+'</b><span>Against</span></div></div><div class="facts"><div><div class="k">First met</div><div class="v">'+dt(c.first)+'</div></div><div><div class="k">Latest</div><div class="v">'+dt(c.last)+'</div></div><div><div class="k">Best result</div><div class="v">'+best.gf+'–'+best.ga+', '+best.d.slice(0,4)+'</div></div><div><div class="k">Worst result</div><div class="v">'+worst.gf+'–'+worst.ga+', '+worst.d.slice(0,4)+'</div></div>'+(top?'<div><div class="k">Top scorer on record</div><div class="v">'+E(top)+' ('+sc[top]+')</div></div>':'')+'</div>';
  $("games").hidden=false; $("games").innerHTML='<h2>Every game</h2><table class="mu"><thead><tr><th>Date</th><th></th><th>Score</th><th>Competition</th><th>Venue</th></tr></thead><tbody>'+L.slice().reverse().map(function(m){var s=scs(m); return '<tr><td style="white-space:nowrap">'+dt(m.d)+'</td><td>'+ven(m.h)+'</td><td style="white-space:nowrap">'+score(m)+'</td><td>'+E(m.t)+'</td><td>'+E(m.v||m.city)+(s?'<span class="note">'+s+'</span>':'')+'</td></tr>'}).join("")+'</tbody></table>'
});

})();
</script></body></html>
