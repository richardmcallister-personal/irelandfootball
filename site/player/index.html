<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" href="/assets/favicon-32.png" type="image/png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0b6e4f"><meta name="apple-mobile-web-app-title" content="Ireland">

<style></style>
</head><body><a class="skip" href="#main-content">Skip to main content</a><div class="wrap">
<header class="mu">
  <a class="brand" href="/"><img src="/assets/crest-88.png" alt="" width="44" height="44" decoding="async"><h1><small>Republic of Ireland</small>Ireland Football</h1></a>
  <div class="from" id="from">Player<span></span></div>
</header>
<nav class="munav" aria-label="Sections"></nav>
<main id="main-content" tabindex="-1">

<div class="sheet" id="top"><p class="sub">Loading…</p></div>
<div class="sheet" id="goals" hidden></div>

</main>
<footer class="mu"><span id="stamp"></span> Results and competitive scorers: <a href="https://github.com/martj42/international_results">martj42 international results</a> (CC0). Venues, managers, notes and caps: Wikipedia (CC BY-SA). Live data: API-Football. An independent fan site, not connected with the FAI.</footer>
</div>
<script src="/mu.js"></script>
<script>
(function(){
MU.nav('Players'); MU.checked("archive",document.getElementById("stamp"),"Archive built");
var $=function(i){return document.getElementById(i)}, E=MU.esc;
function dt(d,o){return new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",o||{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})}
function rc(m){return m.gf>m.ga?"rw":m.gf<m.ga?"rl":"rd"}
function score(m){return '<span class="'+rc(m)+'">'+m.gf+'–'+m.ga+'</span>'+(m.pw!=null?' <small>'+(m.pw?"won":"lost")+' on pens</small>':'')}
function ven(h){return h===1?"H":h===-1?"A":"N"}
function scs(m){var a=(m.sc||[]).map(function(s){return E(s[0])+(s[1]?" "+E(s[1])+"′":"")+(s[2]==="p"?" (pen)":s[2]==="og"?" (og)":"")}); return a.join(", ")}
function wl(t){return t.w+"W "+t.d+"D "+t.l+"L"}
function pct(t){return t.p?Math.round(100*t.w/t.p):0}

var qs=new URLSearchParams(location.search), P=qs.get("p"), Q=qs.get("q");
Promise.all([fetch("/history/players.json").then(function(r){return r.json()}),fetch("/history/player_goals.json").then(function(r){return r.json()})]).then(function(a){var H=a[0], G=a[1], p=null;
  if(P)p=H.filter(function(h){return h.slug===P})[0];
  if(!p&&Q){var sn=MU.slug(Q.split(" ").pop()), ini=/^[A-Z]\./.test(Q)?Q[0].toLowerCase():null; p=H.filter(function(h){return MU.slug(h.name.split(" ").pop())===sn&&(!ini||h.name[0].toLowerCase()===ini)}).sort(function(x,y){return (y.last||"").localeCompare(x.last||"")})[0]}
  if(!p){$("top").innerHTML='<p class="sub">Player not found in the caps list. <a href="/players/">See every player</a>.</p>';return}
  document.title="Ireland · "+p.name; $("from").innerHTML="Player<span>"+E(p.name)+"</span>";
  $("top").innerHTML='<div class="wikip" id="wp"></div><h2>'+E(p.name)+'</h2><div class="h2h"><div><b>'+p.caps+'</b><span>Caps</span></div><div class="w"><b>'+p.goals+'</b><span>Goals</span></div></div><div class="facts"><div><div class="k">Position</div><div class="v">'+p.pos+'</div></div><div><div class="k">Debut</div><div class="v">'+(p.debut?dt(p.debut):"")+' v '+E(p.debo)+'</div></div><div><div class="k">Latest cap</div><div class="v">'+(p.last?dt(p.last):"")+' v '+E(p.lasto)+'</div></div></div>';
  var gl=G[p.slug]||[];
  if(p.goals>0){$("goals").hidden=false; $("goals").innerHTML='<h2>Goals on record</h2><p class="sub" style="margin:0 0 8px">'+gl.length+' of '+p.goals+' listed. Goals in friendlies are not in the match data yet.</p>'+(gl.length?'<table class="mu"><thead><tr><th>Date</th><th>Opponent</th><th>Minute</th><th>Competition</th></tr></thead><tbody>'+gl.slice().reverse().map(function(g){return '<tr><td>'+dt(g.d)+'</td><td>'+MU.club(g.o,14)+'</td><td>'+(g.m?E(g.m)+"′":"")+(g.p?" (pen)":"")+'</td><td>'+E({WC:"World Cup finals",EC:"Euros finals",WCQ:"World Cup qualifying",ECQ:"Euros qualifying",NL:"Nations League",OLY:"Olympic Games",FR:"Friendly"}[g.c]||g.c)+'</td></tr>'}).join("")+'</tbody></table>':"")}
  fetch("/wiki?title="+encodeURIComponent(p.wiki)).then(function(r){return r.json()}).then(function(w){if(w&&w.extract){$("wp").innerHTML=(w.thumbnail?'<img src="'+E(w.thumbnail)+'" alt="" loading="lazy">':'')+'<p style="font-size:14px;margin:0 0 10px">'+E(w.extract)+' <a href="https://en.wikipedia.org/wiki/'+encodeURIComponent(p.wiki)+'" target="_blank" rel="noopener">Wikipedia ↗</a></p>'}}).catch(function(){});
});

})();
</script></body></html>
