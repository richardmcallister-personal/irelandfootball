</main>
<footer class="mu"><span id="stamp"></span> Results and competitive scorers: <a href="https://github.com/martj42/international_results">martj42 international results</a> (CC0). Venues, managers, notes and caps: Wikipedia (CC BY-SA). Live data: API-Football. An independent fan site, not connected with the FAI.</footer>

<script src="/mu.js"></script>
<script>
(function(){
MU.nav('Managers'); MU.checked("archive",document.getElementById("stamp"),"Archive built");
var $=function(i){return document.getElementById(i)}, E=MU.esc;
function dt(d,o){return new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",o||{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})}
function rc(m){return m.gf>m.ga?"rw":m.gf<m.ga?"rl":"rd"}
function score(m){return '<span class="'+rc(m)+'">'+m.gf+'–'+m.ga+'</span>'+(m.pw!=null?' <small>'+(m.pw?"won":"lost")+' on pens</small>':'')}
function ven(h){return h===1?"H":h===-1?"A":"N"}
function scs(m){var a=(m.sc||[]).map(function(s){return E(s[0])+(s[1]?" "+E(s[1])+"′":"")+(s[2]==="p"?" (pen)":s[2]==="og"?" (og)":"")}); return a.join(", ")}
function wl(t){return t.w+"W "+t.d+"D "+t.l+"L"}
function pct(t){return t.p?Math.round(100*t.w/t.p):0}

var M=new URLSearchParams(location.search).get("m");
function tl(L){var t={p:L.length,w:0,d:0,l:0,gf:0,ga:0}; L.forEach(function(m){t[rc(m)==="rw"?"w":rc(m)==="rl"?"l":"d"]++; t.gf+=m.gf; t.ga+=m.ga}); return t}
Promise.all([fetch("/history/managers.json").then(function(r){return r.json()}),fetch("/history/matches.json").then(function(r){return r.json()}),fetch("/history/players.json").then(function(r){return r.json()})]).then(function(a){
  var S=a[0].filter(function(s){return s.slug===M}); if(!S.length){$("top").innerHTML='<p class="sub">Manager not found. <a href="/managers/">See every manager</a>.</p>';return}
  var s0=S[0], name=s0.name.replace(", Sr.",""), t={p:0,w:0,d:0,l:0,gf:0,ga:0}; S.forEach(function(s){["p","w","d","l","gf","ga"].forEach(function(k){t[k]+=s[k]})});
  var L=a[1].filter(function(m){return m.ms===M}), P=a[2].filter(function(p){return p.slug===M})[0], notes=S.map(function(s){return s.note}).filter(Boolean);
  document.title="Ireland · "+name; $("from").innerHTML="Manager<span>"+E(name)+"</span>";
  var best=L.slice().sort(function(x,y){return (y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf})[0], worst=L.slice().sort(function(x,y){return (x.gf-x.ga)-(y.gf-y.ga)||y.ga-x.ga})[0];
  var f=[["Years in charge",S.map(function(s){return E(s.career)}).join(", ")],["Win rate",pct(t)+"%"]];
  if(best)f.push(["Biggest win",best.gf>best.ga?best.gf+"–"+best.ga+" v "+E(best.o)+", "+best.d.slice(0,4):"No wins in the games listed"]);
  if(worst)f.push(["Heaviest defeat",worst.gf<worst.ga?worst.gf+"–"+worst.ga+" v "+E(worst.o)+", "+worst.d.slice(0,4):"No defeats in the games listed"]);
  if(P)f.push(["As a player",'<a href="/player/?p='+P.slug+'">'+P.caps+" caps, "+P.goals+" goals</a>"]);
  notes.forEach(function(n){f.push(["Note",E(n)])});
  $("top").innerHTML='<div class="wikip" id="wp"></div><h2>'+E(name)+'</h2><div class="h2h"><div><b>'+t.p+'</b><span>Played</span></div><div class="w"><b>'+t.w+'</b><span>Won</span></div><div><b>'+t.d+'</b><span>Drawn</span></div><div class="l"><b>'+t.l+'</b><span>Lost</span></div><div><b>'+t.gf+'</b><span>For</span></div><div><b>'+t.ga+'</b><span>Against</span></div></div><div class="facts">'+f.map(function(x){return '<div><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>'}).join("")+'</div>';
  $("games").hidden=false;
  if(L.length){var C={},G={}; L.forEach(function(m){(C[m.c]=C[m.c]||[]).push(m); (m.sc||[]).forEach(function(s){if(s[2]!=="og")G[s[0]]=(G[s[0]]||0)+1})});
    var N={WC:"World Cup finals",EC:"Euros finals",WCQ:"World Cup qualifying",ECQ:"Euros qualifying",NL:"Nations League",OLY:"Olympic Games",FR:"Friendlies"};
    $("split").hidden=false; $("comps").innerHTML='<h2>By competition</h2><table class="mu"><thead><tr><th></th><th class="n">P</th><th class="n">W</th><th class="n">D</th><th class="n">L</th></tr></thead><tbody>'+Object.keys(N).filter(function(c){return C[c]}).map(function(c){var x=tl(C[c]); return '<tr><td>'+MU.compRow(C[c][C[c].length-1])+N[c]+'</td><td class="n">'+x.p+'</td><td class="n">'+x.w+'</td><td class="n">'+x.d+'</td><td class="n">'+x.l+'</td></tr>'}).join("")+'</tbody></table>';
    var top=Object.keys(G).sort(function(x,y){return G[y]-G[x]}).slice(0,8);
    $("scor").innerHTML='<h2>Top scorers</h2>'+(top.length?'<table class="mu"><thead><tr><th>Player</th><th class="n">Goals</th></tr></thead><tbody>'+top.map(function(n){return '<tr><td>'+E(n)+'</td><td class="n">'+G[n]+'</td></tr>'}).join("")+'</tbody></table>':'<p class="sub">No scorers on record for these games.</p>')+'<p class="sub">Some friendlies before 2017 are still missing, as their scorers are not all in the data yet.</p>';
    $("games").innerHTML='<h2>Every game</h2>'+(L.length!==t.p?'<p class="sub" style="margin:0 0 8px">'+L.length+' games listed, against '+t.p+' in the Wikipedia record above. The two do not always agree.</p>':'')+'<table class="mu"><thead><tr><th>Date</th><th>Opponent</th><th></th><th>Score</th><th>Competition</th><th>Venue</th></tr></thead><tbody>'+L.slice().reverse().map(function(m){var s=scs(m); return '<tr><td style="white-space:nowrap">'+dt(m.d)+'</td><td>'+MU.club(m.o,14)+'</td><td>'+ven(m.h)+'</td><td style="white-space:nowrap">'+score(m)+'</td><td>'+MU.compRow(m)+E(m.t)+'</td><td>'+E(m.v||m.city)+(s?'<span class="note">'+s+'</span>':'')+'</td></tr>'}).join("")+'</tbody></table>'}
  else $("games").innerHTML='<p class="sub">The individual games for this spell could not be confirmed from the sources yet.</p>';
  if(s0.wiki)fetch("/wiki?title="+encodeURIComponent(s0.wiki)).then(function(r){return r.json()}).then(function(w){if(w&&w.extract){$("wp").innerHTML=(w.thumbnail?'<img src="'+E(w.thumbnail)+'" alt="" loading="lazy">':'')+'<p style="font-size:14px;margin:0 0 10px">'+E(w.extract)+' <a href="https://en.wikipedia.org/wiki/'+encodeURIComponent(s0.wiki)+'" target="_blank" rel="noopener">Wikipedia ↗</a></p>'}}).catch(function(){});
});

})();
</script></body></html>
